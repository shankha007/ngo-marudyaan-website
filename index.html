<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NGO Marudyaan — __SITE_TAGLINE__ | Kolkata</title>
    <meta
      name="description"
      content="NGO Marudyaan (মরুদ্যান) is a volunteer-run organisation in Kolkata working on food, education, health camps, winter relief and festivals."
    />
    <meta name="theme-color" content="#f7f6ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06120d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- __SITE_URL__ (below) is replaced with site.url from src/data/site.js
         (scripts/seo.mjs, which also adds the organisation's JSON-LD).
         Each page then updates the canonical link and og:url / og:title /
         og:description for its own address: see src/hooks/usePageMeta.js -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Social sharing (Facebook / WhatsApp / X preview).
         The image must be a JPG or PNG at a full https:// address.
         Remake it with: npm run og-image -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NGO Marudyaan" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="NGO Marudyaan — __SITE_TAGLINE__" />
    <meta
      property="og:description"
      content="A volunteer-run NGO in Kolkata: food, education, health, winter relief and festivals."
    />
    <meta property="og:image" content="__SITE_URL__/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NGO Marudyaan — __SITE_TAGLINE__, Kolkata" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="bn_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts (Bricolage Grotesque, Inter, Noto Sans Bengali) are self-hosted: see src/main.jsx -->

    <!-- Runs before the first paint:
         1. light / dark mode — the visitor's saved choice, else the device setting
            (no flash of the wrong colours);
         2. on the home page only, start downloading the first banner photo
            (its details are in the hero-preload tag added by scripts/project-photos.mjs).
         The Content-Security-Policy in public/_headers allows this exact script by
         its hash. If you change a single character here, `npm run build` stops
         and prints the new hash to put in public/_headers and vercel.json. -->
    <script>try{var t=localStorage.getItem("marudyaan-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}var m=document.querySelector('meta[name="hero-preload"]');if(m&&location.pathname==="/"){try{var d=JSON.parse(m.content),l=document.createElement("link");for(var k in d)l[k]=d[k];document.head.appendChild(l)}catch(e){}}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
