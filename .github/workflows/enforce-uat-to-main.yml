# Pull requests into main may only come from uat.
# The "main" ruleset on GitHub requires this check to pass before merging.
name: Enforce uat → main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  source-branch:
    name: source-branch-is-uat
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from uat
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "uat" ] || [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "::error::Pull requests into main must come from the uat branch of this repository (got '$HEAD_REPO:$HEAD_REF')."
            exit 1
          fi
          echo "Source branch is uat."
